---
- name: Install Apache
  hosts: webservers
  become: yes

  tasks:

    - name: install apache
      apt:
        name: apache2
        state: present
        update_cache: yes

    - name: start apache
      service:
        name: apache2
        state: started
        enabled: yes

    - name: create index file
      copy:
        content: "Hello from Ansible"
        dest: /var/www/html/index.html
