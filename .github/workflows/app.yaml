name: Node app CLI

on:
  push:
    branches:
      - main:


jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: checkout code
        uses: actions/checkout@v3

      - name: install node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: install dependencies
        run: npm install

      - name: run tests
        run: npm test

      - name: build docker image
        run: docker build -t myapp .
